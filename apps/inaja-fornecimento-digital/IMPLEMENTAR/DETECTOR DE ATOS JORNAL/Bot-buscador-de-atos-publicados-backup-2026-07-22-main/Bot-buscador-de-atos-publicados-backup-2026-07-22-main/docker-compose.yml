services:
  app:
    image: aajunior43/bot-buscador-de-atos:latest
    container_name: bot-buscador-de-atos
    working_dir: /workspace
    command: uvicorn webapp:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: production
      REQUIRE_WEBAPP_AUTH: "true"
      DB_PATH: /workspace/data/jornal_monitor.db
      DOWNLOAD_DIR: /workspace/data/edicoes
      ATOS_DIR: /workspace/data/atos
      ALERT_DIR: /workspace/data/alertas
      LOG_DIR: /workspace/data/logs
      TESSERACT_PATH: /usr/bin/tesseract
      POPPLER_PATH: /usr/bin
    volumes:
      - monitor-data:/workspace/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.jornal-monitor.rule=Host(`jornal.srv1767486.hstgr.cloud`)
      - traefik.http.routers.jornal-monitor.entrypoints=websecure
      - traefik.http.routers.jornal-monitor.tls=true
      - traefik.http.routers.jornal-monitor.tls.certresolver=letsencrypt
      - traefik.http.services.jornal-monitor.loadbalancer.server.port=8000
    networks:
      - default
      - traefik-public
    tty: true
    stdin_open: true
    restart: unless-stopped

  worker:
    image: aajunior43/bot-buscador-de-atos:latest
    container_name: bot-buscador-de-atos-worker
    working_dir: /workspace
    command: python main.py
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: production
      REQUIRE_WEBAPP_AUTH: "true"
      DB_PATH: /workspace/data/jornal_monitor.db
      DOWNLOAD_DIR: /workspace/data/edicoes
      ATOS_DIR: /workspace/data/atos
      ALERT_DIR: /workspace/data/alertas
      LOG_DIR: /workspace/data/logs
      TESSERACT_PATH: /usr/bin/tesseract
      POPPLER_PATH: /usr/bin
    volumes:
      - monitor-data:/workspace/data
    depends_on:
      - app
    restart: unless-stopped

networks:
  traefik-public:
    external: true

volumes:
  monitor-data:
