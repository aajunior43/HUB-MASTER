<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Meus Links</title>
<style>
  :root {
    --bg: #0a0f0a; --surface: #121812; --text: #e6f3ec;
    --muted: #7f9089; --accent: #2dd4a8; --border: #1e2820;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { min-width: 340px; color: var(--text); font-family: 'Work Sans', system-ui, sans-serif; font-size: 14px; }
  .app { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .brand { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); letter-spacing: 1px; }
  label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.6px; }
  input, select, textarea, button {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 8px 10px; border-radius: 10px; font: inherit; outline: none;
  }
  textarea { resize: vertical; min-height: 60px; font-family: inherit; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  button { cursor: pointer; background: var(--accent); color: #052018; font-weight: 600; border: none; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 500; }
  button.small { padding: 5px 8px; font-size: 12px; width: auto; }
  button:disabled { opacity: 0.6; cursor: default; }
  .tabs { display: flex; gap: 4px; background: var(--surface); padding: 3px; border-radius: 12px; border: 1px solid var(--border); }
  .tab { flex: 1; padding: 6px 4px; text-align: center; font-size: 11px; border-radius: 9px; cursor: pointer; color: var(--muted); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.5px; user-select: none; }
  .tab.active { background: var(--bg); color: var(--accent); }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; }
  .toggles { display: flex; gap: 12px; font-size: 12px; }
  .toggles label { display: flex; gap: 6px; align-items: center; margin: 0; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--text); cursor: pointer; }
  .toggles input { width: auto; }
  .msg { font-size: 12px; padding: 7px 9px; border-radius: 8px; }
  .msg.ok { background: rgba(45,212,168,0.1); color: var(--accent); }
  .msg.err { background: rgba(248,113,113,0.1); color: var(--danger); }
  .msg.warn { background: rgba(255,200,80,0.1); color: #ffc850; }
  .footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); padding-top: 4px; border-top: 1px solid var(--border); margin-top: 4px; }
  .link { color: var(--accent); cursor: pointer; text-decoration: none; background: none; border: none; padding: 0; width: auto; font-size: 11px; }
  .list { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow: auto; }
  .item { padding: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 12px; }
  .item:hover { border-color: var(--accent); }
  .item .name { font-weight: 600; }
  .item .sub { color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 12px; }
</style>
</head>
<body>
  <div class="app" id="app"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
