<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JRStatus</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Archivo Black (Heavy), Space Mono (Code), Inter (Sans), Playfair Display (Serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,900;1,600&display=swap" rel="stylesheet">
    
    <!-- html2canvas for image export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['"Space Mono"', 'monospace'],
              display: ['"Archivo Black"', 'sans-serif'],
              serif: ['"Playfair Display"', 'serif'],
            },
            colors: {
              'acid-green': '#ccff00',
              'neon-pink': '#ff00ff',
              'electric-blue': '#0000ff',
              'pure-red': '#ff0000',
              'off-white': '#f0f0f0',
            },
            boxShadow: {
              'hard': '4px 4px 0px 0px rgba(0,0,0,1)',
              'hard-lg': '8px 8px 0px 0px rgba(0,0,0,1)',
              'hard-xl': '12px 12px 0px 0px rgba(0,0,0,1)',
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scrollbar for brutalist feel */
      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #000; 
      }
      ::-webkit-scrollbar-thumb {
        background: #fff; 
        border: 2px solid #000;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ccff00; 
      }
      
      /* Technical Grid Background */
      .bg-grid-pattern {
        background-size: 40px 40px;
        background-image:
          linear-gradient(to right, #e5e5e5 1px, transparent 1px),
          linear-gradient(to bottom, #e5e5e5 1px, transparent 1px);
      }

      /* Noise utility - Sharper Fractal Noise for Concrete/Paper texture */
      .bg-noise {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.5'/%3E%3C/svg%3E");
      }

      /* Marquee Animation */
      .marquee-container {
        overflow: hidden;
        white-space: nowrap;
      }
      .marquee-content {
        display: inline-block;
        animation: marquee 20s linear infinite;
      }
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }

      /* Glitch Button Effect */
      .glitch-btn {
        position: relative;
        overflow: hidden;
      }

      .glitch-btn::before,
      .glitch-btn::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: inherit;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        pointer-events: none;
      }

      .glitch-btn:hover::before {
        opacity: 1;
        color: #ff00ff; /* Pink glitch layer */
        z-index: 1;
        animation: glitch-anim-1 0.3s infinite linear alternate-reverse;
      }

      .glitch-btn:hover::after {
        opacity: 1;
        color: #ccff00; /* Green glitch layer */
        z-index: 2;
        animation: glitch-anim-2 0.3s infinite linear alternate-reverse;
      }

      @keyframes glitch-anim-1 {
        0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 0); }
        20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, 0); }
        40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 0); }
        60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, 0); }
        80% { clip-path: inset(10% 0 70% 0); transform: translate(-2px, 0); }
        100% { clip-path: inset(30% 0 20% 0); transform: translate(2px, 0); }
      }

      @keyframes glitch-anim-2 {
        0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, 0); }
        20% { clip-path: inset(30% 0 20% 0); transform: translate(-2px, 0); }
        40% { clip-path: inset(70% 0 10% 0); transform: translate(2px, 0); }
        60% { clip-path: inset(20% 0 50% 0); transform: translate(-2px, 0); }
        80% { clip-path: inset(60% 0 30% 0); transform: translate(2px, 0); }
        100% { clip-path: inset(15% 0 80% 0); transform: translate(-2px, 0); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",

}
</script>

</html>
