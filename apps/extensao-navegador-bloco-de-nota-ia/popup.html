<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Notes AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <h1>📝 Quick Notes AI</h1>
        <span class="subtitle">Nomes inteligentes com IA</span>
      </div>
      <div class="header-actions">
        <button id="clearBtn" class="btn-icon" title="Limpar notas (Ctrl+L)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
        <button id="downloadBtn" class="btn-icon btn-primary" title="Baixar com IA (Ctrl+D)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
      </div>
    </header>

    <div class="editor">
      <textarea
        id="noteArea"
        placeholder="Comece a escrever suas notas aqui... A IA criará um nome apropriado quando você baixar!"
        spellcheck="false"
      ></textarea>
    </div>

    <footer>
      <div class="footer-info">
        <div class="char-count" id="charCount">0 caracteres</div>
        <div class="word-count" id="wordCount">0 palavras</div>
      </div>
      <div class="api-key-section">
        <input
          type="password"
          id="apiKeyInput"
          placeholder="API Key do Gemini"
          autocomplete="off"
        />
        <button id="saveKeyBtn" class="btn-save-key">
          <span id="saveKeyText">Salvar</span>
        </button>
      </div>
    </footer>

    <div id="statusMessage" class="status-message"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
